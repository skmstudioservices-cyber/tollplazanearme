name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Guard - secrets present?
        id: guard
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then echo "present=false" >> "$GITHUB_OUTPUT";
            echo "No CF token on this repo - deploy via the network bridge (deploy-queue). Not a failure.";
          else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: ${{ steps.guard.outputs.present == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name="${{ github.event.repository.name }}" --branch=main --commit-dirty=true
      - name: Verify live content
        if: ${{ steps.guard.outputs.present == 'true' }}
        run: |
          sleep 20
          BASE="https://${{ github.event.repository.name }}.pages.dev"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          code=$(curl -s -L -o /tmp/h.html -w '%{http_code}' -m 30 -A "$UA" "$BASE/")
          echo "home=$code"; [ "$code" = "200" ] || exit 1
          grep -q '<h1' /tmp/h.html || { echo "::error::no h1"; exit 1; }
